name: Python checks
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install scikit-learn==1.8.0 pandas==2.3.3
      - run: python -m unittest discover -s code -p 'test_*.py'
